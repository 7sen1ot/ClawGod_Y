name: Extended platform compatibility

on:
  workflow_call:
  schedule:
    - cron: '23 6 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Default Claude on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-26-intel]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun run build
      - name: Install ripgrep
        shell: bash
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            if [[ "$RUNNER_OS" == Linux ]]; then
              sudo apt-get update -qq && sudo apt-get install -y ripgrep
            else
              brew install ripgrep
            fi
          fi
      - name: Install and probe the default version on the native architecture
        shell: bash
        run: |
          set -euo pipefail
          version=$(bun -e 'console.log((await Bun.file("src/shared/runtime-version.json").json()).upstreamVersion)')
          mkdir -p dist/runtime
          tar -xzf dist/clawgod-runtime.tar.gz -C dist/runtime
          bun dist/runtime/install-runtime.mjs "$version"
          [[ "$(cat "$HOME/.clawgod/.source-version")" == "$version" ]]
          [[ "$("$HOME/.clawgod/claude.fallback" --version)" == "$version (Claude Code)" ]]
          "$HOME/.local/bin/clawgod" --version
          bun "$HOME/.clawgod/startup-check.mjs" "$(command -v bun)" "$HOME/.clawgod/cli.mjs" --probe-tools

  musl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install and probe on Alpine musl
        shell: bash
        run: |
          docker run --rm -i -v "$GITHUB_WORKSPACE:/workspace" -w /workspace "oven/bun:$(cat .bun-version)-alpine" sh <<'SH'
          set -eu
          apk add --no-cache bash ripgrep coreutils tar
          bash -eu <<'BASH'
          bun run build
          version=$(bun -e 'console.log((await Bun.file("src/shared/runtime-version.json").json()).upstreamVersion)')
          mkdir -p dist/runtime
          tar -xzf dist/clawgod-runtime.tar.gz -C dist/runtime
          bun dist/runtime/install-runtime.mjs "$version"
          [[ "$(cat "$HOME/.clawgod/.source-version")" == "$version" ]]
          [[ "$("$HOME/.clawgod/claude.fallback" --version)" == "$version (Claude Code)" ]]
          "$HOME/.local/bin/clawgod" --version
          bun "$HOME/.clawgod/startup-check.mjs" "$(command -v bun)" "$HOME/.clawgod/cli.mjs" --probe-tools
          BASH
          SH
