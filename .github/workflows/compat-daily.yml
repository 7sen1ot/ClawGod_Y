name: Compatibility CI

on:
  workflow_call:
  schedule:
    - cron: '0 23 * * 0'
      timezone: America/Los_Angeles
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .bun-version
      - build.js
      - package.json
      - tsconfig.json
      - biome.json
      - src/**
      - '!src/README.md'
      - .github/workflows/compat-daily.yml
      - .github/workflows/installer-checks.yml
      - .github/workflows/platform-compat.yml
      - .github/workflows/release.yml
      - .github/scripts/**
      - '!.github/scripts/close-inactive-issues*.mjs'
  pull_request:
    paths:
      - .bun-version
      - build.js
      - package.json
      - tsconfig.json
      - biome.json
      - src/**
      - '!src/README.md'
      - .github/workflows/compat-daily.yml
      - .github/workflows/installer-checks.yml
      - .github/workflows/platform-compat.yml
      - .github/workflows/release.yml
      - .github/scripts/**
      - '!.github/scripts/close-inactive-issues*.mjs'

permissions:
  contents: read

jobs:
  build-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.resolve.outputs.versions }}
      tested: ${{ steps.resolve.outputs.tested }}
      smoke: ${{ steps.scope.outputs.smoke }}
      installer: ${{ steps.scope.outputs.installer }}
      proxy: ${{ steps.scope.outputs.proxy }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - name: Select checks for the changed modules
        id: scope
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          source=true installer=true proxy=true smoke=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            source=false installer=false proxy=false smoke=false
            changed=$(git diff --name-only --no-renames "$PR_BASE...$PR_HEAD")
            while IFS= read -r file; do
              case "$file" in
                src/shared/openai-proxy.mjs|src/tests/openai-proxy*.test.mjs|src/tests/prompt-request.integration.test.mjs)
                  proxy=true ;;
                src/tests/startup-check.test.mjs|src/tests/post-process.test.mjs|src/tests/bun-ant-shim.test.mjs|src/tests/installer-lifecycle.test.mjs|src/tests/npm-fetch.test.mjs|src/tests/extract-natives.test.mjs|src/tests/compile-runtime.test.mjs)
                  installer=true ;;
                src/tests/*)
                  source=true ;;
                src/README.md|.github/scripts/close-inactive-issues*.mjs)
                  ;;
                .bun-version|build.js|package.json|tsconfig.json|biome.json|src/*|.github/workflows/compat-daily.yml|.github/workflows/installer-checks.yml|.github/workflows/platform-compat.yml|.github/workflows/release.yml|.github/scripts/*)
                  source=true installer=true proxy=true smoke=true ;;
              esac
            done <<< "$changed"
          fi
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "installer=$installer" >> "$GITHUB_OUTPUT"
          echo "proxy=$proxy" >> "$GITHUB_OUTPUT"
          echo "smoke=$smoke" >> "$GITHUB_OUTPUT"
      - name: Set up Bun
        if: steps.scope.outputs.source == 'true' || steps.scope.outputs.smoke == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - id: resolve
        if: steps.scope.outputs.smoke == 'true'
        run: bun .github/scripts/resolve-claude-versions.mjs
      - run: bun run test:source
        if: steps.scope.outputs.source == 'true'
      - name: Check types and lint
        if: steps.scope.outputs.source == 'true'
        run: |
          bun install --ignore-scripts
          bun run check

  installer-checks:
    needs: build-sources
    if: needs.build-sources.outputs.installer == 'true' || needs.build-sources.outputs.proxy == 'true'
    uses: ./.github/workflows/installer-checks.yml
    with:
      installer_checks: ${{ needs.build-sources.outputs.installer == 'true' }}
      proxy_checks: ${{ needs.build-sources.outputs.proxy == 'true' }}

  smoke:
    name: ${{ matrix.name }} (Claude ${{ matrix.claude.channels }})
    needs: build-sources
    if: needs.build-sources.outputs.smoke == 'true'
    strategy:
      fail-fast: false
      matrix:
        claude: ${{ fromJSON(needs.build-sources.outputs.versions) }}
        os: [ubuntu-latest, macos-26]
        include:
          - name: Linux smoke (x64)
            os: ubuntu-latest
            platform: linux
            arch: x86_64
          - name: macOS smoke (ARM64)
            os: macos-26
            platform: macos
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      SMOKE_PLATFORM: ${{ matrix.platform }}
      EXPECTED_ARCH: ${{ matrix.arch }}
      CLAUDE_CHANNEL: ${{ matrix.claude.channels }}
      CLAUDE_VERSION: ${{ matrix.claude.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install ripgrep (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ripgrep
          rg --version | head -1

      - name: Install ripgrep (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            brew install ripgrep
          fi
          rg --version | head -1

      - name: Add ~/.local/bin to PATH (clawgod launcher install target)
        shell: bash
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Print runtime versions
        shell: bash
        run: |
          bun --version
          uname -a
          [[ "$(uname -m)" == "$EXPECTED_ARCH" ]] || { echo "::error::unexpected runner architecture"; exit 1; }
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            sw_vers
          fi

      - run: bun run build
      - name: Configure a provider before fresh installation
        run: bun src/ci/provider-startup-fixture.mjs seed

      - name: Run install.sh (registry download)
        shell: bash
        run: |
          set -euo pipefail
          echo "Testing Claude $CLAUDE_CHANNEL -> $CLAUDE_VERSION"
          mkdir -p dist/runtime
          tar -xzf dist/clawgod-runtime.tar.gz -C dist/runtime
          bun dist/runtime/install-runtime.mjs "$CLAUDE_VERSION" 2>&1 | tee /tmp/install.log

      - name: Verify install artifacts
        shell: bash
        run: |
          ls -la "$HOME/.clawgod/" || true
          for f in cli.mjs cli.original.cjs startup-check.mjs startup-check.log patch.mjs extract-natives.mjs post-process.mjs feature-gates.mjs runtime-helpers.mjs bun-ant-shim.mjs .source-version; do
            test -e "$HOME/.clawgod/$f" || { echo "::error::missing ~/.clawgod/$f"; exit 1; }
          done
          version=$(cat "$HOME/.clawgod/.source-version")
          echo "Source: $version"
          [[ "$version" == "$CLAUDE_VERSION" ]] || { echo "::error::expected Claude $CLAUDE_VERSION, installed $version"; exit 1; }
          native_version=$("$HOME/.clawgod/claude.fallback" --version)
          [[ "$native_version" == "$version (Claude Code)" ]] || { echo "::error::native subprocess version mismatch: $native_version"; exit 1; }

      - name: Assert renderer runtime was reported
        shell: bash
        run: |
          grep -q 'Renderer runtime:' /tmp/install.log \
            || { echo "::error::install.sh did not report the renderer runtime"; exit 1; }
          grep 'Renderer runtime:' /tmp/install.log

      - name: Verify Bun.ant shim provides the renderer API
        shell: bash
        run: |
          bun -e '
            require(require("os").homedir() + "/.clawgod/bun-ant-shim.mjs");
            if (typeof Bun.ant?.CellSegmenter !== "function") {
              console.error("::error::bun-ant-shim did not install Bun.ant.CellSegmenter");
              process.exit(1);
            }
            const seg = new Bun.ant.CellSegmenter({
              ambiguousIsNarrow: true,
              screen: { widthMask: 3, narrow: 0, wide: 1, spacerTail: 2, spacerHead: 3, emptyCharIndex: 0, spacerCharIndex: 1, emptyWord: 0, tabWidth: 8 },
              tabWidth: 8,
            });
            const cells = new Int32Array(64);
            const runs = new Int32Array(64);
            if (seg.segment("ab", cells, runs, false) !== 2) {
              console.error("::error::segment() mismatch");
              process.exit(1);
            }
            const screen = new Int32Array(64);
            const charMap = new Int32Array(seg.graphemes.length);
            if (seg.paint(screen, 8, 0, 0, cells, 2, undefined, charMap, new Int32Array(2)) === 0) {
              console.error("::error::paint() reported no damage");
              process.exit(1);
            }
            console.log("bun-ant shim: OK");
          '

      - name: Check patch coverage against the known baseline
        shell: bash
        run: |
          bun src/ci/check-patch-coverage.mjs /tmp/install.log "$SMOKE_PLATFORM"

      - name: Verify configured provider was preserved
        run: bun src/ci/provider-startup-fixture.mjs verify /tmp/install.log

      - name: Verify lean settings applied
        shell: bash
        run: |
          scoped="$HOME/.clawgod/lean-settings.json"
          [[ -f "$scoped" ]] || { echo "::error::~/.clawgod/lean-settings.json not created"; exit 1; }
          for key in disableWorkflows disableClaudeAiConnectors disableArtifact disableRemoteControl; do
            if ! grep -q "\"$key\"" "$scoped"; then
              echo "::error::lean key $key missing from lean-settings.json"
              cat "$scoped"
              exit 1
            fi
          done
          for tool in DesignSync NotebookEdit Projects; do
            if ! grep -q "\"$tool\"" "$scoped"; then
              echo "::error::deny tool $tool missing from lean-settings.json"
              cat "$scoped"
              exit 1
            fi
          done
          if [[ -f "$HOME/.claude/settings.json" ]] && grep -q '"disableWorkflows"' "$HOME/.claude/settings.json"; then
            echo "::error::shared settings.json must not carry lean keys"
            cat "$HOME/.claude/settings.json"
            exit 1
          fi
          echo "Lean settings verified:"
          cat "$scoped"

      - name: Smoke test — clawgod --version
        timeout-minutes: 1
        shell: bash
        run: |
          set +e
          out=$(clawgod --version 2>&1)
          rc=$?
          set -e
          echo "$out"
          if echo "$out" | grep -q "Expected CommonJS module to have a function wrapper"; then
            echo "::error::Bun CJS-wrapper panic — local Bun lags the embedded Bun"
            exit 1
          fi
          [[ $rc -eq 0 ]] || { echo "::error::clawgod --version exited $rc"; exit 1; }
          if echo "$out" | grep -qi 'proxy on port'; then
            echo '::error::version query started a provider listener'
            exit 1
          fi

      - name: Smoke test — tool/command table probe
        timeout-minutes: 2
        shell: bash
        run: |
          set +e
          out=$(bun "$HOME/.clawgod/startup-check.mjs" "$(command -v bun)" "$HOME/.clawgod/cli.mjs" --probe-tools 2>&1)
          rc=$?
          set -e
          echo "$out"
          [[ $rc -eq 0 ]] || { echo "::error::tool/command table probe exited $rc"; exit 1; }
          if echo "$out" | grep -qE "null is not an object|l\.name|s\.isMcp"; then
            echo "::error::null hole detected in tool/command tables"
            exit 1
          fi

      - name: Functional checks — runtime invariants
        shell: bash
        run: |
          exec_path="$HOME/.clawgod/claude.fallback"
          [[ -f "$exec_path" ]] || { echo "::error::execPath fallback binary missing ($exec_path)"; exit 1; }
          export CLAUDE_CODE_EXECPATH="$exec_path"
          echo "execPath: $exec_path"

          echo "── Checking fv() patched (Bun.isStandaloneExecutable → true) ──"
          if grep -q 'Bun\.isStandaloneExecutable===!0' "$HOME/.clawgod/cli.original.cjs"; then
            echo "::error::fv() not patched — Bun.isStandaloneExecutable===!0 still in source"
            exit 1
          fi
          echo "  fv() patched: OK"

          echo "── Checking process.execPath monkey-patch in wrapper ──"
          grep -q 'CLAUDE_CODE_EXECPATH' "$HOME/.clawgod/cli.mjs" || {
            echo "::error::cli.mjs missing CLAUDE_CODE_EXECPATH monkey-patch"
            exit 1
          }
          echo "  execPath patch: OK"

          echo "── Checking multitool dispatch (ugrep, bfs, rg) ──"
          for tool in ugrep bfs rg; do
            if ARGV0="$tool" "$exec_path" --version >/dev/null 2>&1; then
              echo "  $tool dispatch: OK"
            else
              echo "::error::multitool dispatch failed for $tool via $exec_path"
              exit 1
            fi
          done

          echo "── Checking openai-proxy.mjs exists ──"
          test -f "$HOME/.clawgod/openai-proxy.mjs" || { echo "::error::openai-proxy.mjs missing"; exit 1; }
          echo "  openai-proxy.mjs: OK ($(wc -c < "$HOME/.clawgod/openai-proxy.mjs") bytes)"

          echo "── All functional checks passed ──"

  publish-badge:
    permissions:
      contents: write
    needs: [build-sources, installer-checks, smoke, windows-smoke]
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish supported-Claude-version badge after all checks pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_VERSION: ${{ needs.build-sources.outputs.tested }}
        run: |
          version="$CLAUDE_VERSION"
          tmp=$(mktemp -d)
          cd "$tmp"
          cat > claude-version.json <<EOF
          {
            "schemaVersion": 1,
            "label": "Claude tested",
            "message": "$version",
            "color": "brightgreen"
          }
          EOF
          git init -q -b badges
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add claude-version.json
          git commit -q -m "compat-daily: claude $version verified"
          git push -fq "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:badges
          echo "Published badge: claude $version"

  report-failures:
    needs: [build-sources, smoke, windows-smoke]
    if: ${{ !cancelled() && github.event_name == 'schedule' && (needs.smoke.result == 'failure' || needs.windows-smoke.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          VERSIONS: ${{ needs.build-sources.outputs.versions }}
        with:
          script: |
            const repo = context.repo;
            const versions = new Map(JSON.parse(process.env.VERSIONS).map(row => [row.channels, row.version]));
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
              ...repo, run_id: context.runId, attempt_number: Number(process.env.GITHUB_RUN_ATTEMPT),
            });
            const open = await github.paginate(github.rest.issues.listForRepo, {
              ...repo, labels: 'compat-broken', state: 'open', per_page: 100,
            });
            for (const job of jobs) {
              if (!['failure', 'timed_out'].includes(job.conclusion)) continue;
              const match = /^(Linux|macOS|Windows) smoke .*?\bClaude ([^)]+)\)$/.exec(job.name);
              if (!match || !versions.has(match[2])) continue;
              const [, platform, channels] = match;
              const prefix = platform === 'Linux' ? 'compat-daily' : 'compat-daily/' + platform.toLowerCase();
              const title = `${prefix}/${channels}: broke (claude ${versions.get(channels)})`;
              const body = `${job.name} failed. [View job log](${job.html_url})`;
              const issue = open.find(item => !item.pull_request && item.title === title);
              if (issue) await github.rest.issues.createComment({ ...repo, issue_number: issue.number, body });
              else await github.rest.issues.create({ ...repo, title, body, labels: ['compat-broken', 'bug'] });
            }

  windows-smoke:
    name: Windows smoke (PowerShell 5.1, Claude ${{ matrix.claude.channels }})
    needs: build-sources
    if: needs.build-sources.outputs.smoke == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        claude: ${{ fromJSON(needs.build-sources.outputs.versions) }}
    env:
      CLAUDE_CHANNEL: ${{ matrix.claude.channels }}
      CLAUDE_VERSION: ${{ matrix.claude.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install terminal test dependencies
        shell: powershell
        run: |
          bun install --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install ripgrep
        shell: powershell
        run: |
          if (-not (Get-Command rg -ErrorAction SilentlyContinue)) {
            choco install ripgrep --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          rg --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Add ClawGod launcher directory to PATH
        shell: powershell
        run: |
          "$env:USERPROFILE\.local\bin" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Print runtime versions
        shell: powershell
        run: |
          Write-Host "PowerShell $($PSVersionTable.PSVersion)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rg --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - run: bun run build
      - name: Configure a provider before fresh installation
        run: bun src/ci/provider-startup-fixture.mjs seed

      - name: Run install.ps1 with version argument (registry download)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Testing Claude $env:CLAUDE_CHANNEL -> $env:CLAUDE_VERSION"
          $log = Join-Path $env:RUNNER_TEMP 'install-windows.log'
          $runtime = Join-Path $env:RUNNER_TEMP 'clawgod-runtime'
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          tar -xzf dist/clawgod-runtime.tar.gz -C $runtime
          if ($LASTEXITCODE -ne 0) { throw 'Runtime extraction failed' }
          $previousErrorAction = $ErrorActionPreference
          try {
            $ErrorActionPreference = 'Continue'
            bun (Join-Path $runtime 'install-runtime.mjs') $env:CLAUDE_VERSION *>&1 |
              ForEach-Object { "$_" } | Tee-Object -FilePath $log
            $installExit = $LASTEXITCODE
          } finally {
            $ErrorActionPreference = $previousErrorAction
          }
          if ($installExit -ne 0) { throw "Runtime installation failed (exit $installExit)" }

      - name: Verify install artifacts
        shell: powershell
        run: |
          $clawDir = Join-Path $env:USERPROFILE '.clawgod'
          Get-ChildItem -Force $clawDir
          $required = @(
            'cli.mjs',
            'cli.original.cjs',
            'startup-check.mjs',
            'startup-check.log',
            'patch.mjs',
            'extract-natives.mjs',
            'post-process.mjs',
            'feature-gates.mjs',
            'runtime-helpers.mjs',
            'bun-ant-shim.mjs',
            '.source-version'
          )
          foreach ($name in $required) {
            $path = Join-Path $clawDir $name
            if (-not (Test-Path $path)) {
              Write-Error "Missing install artifact: $path"
            }
          }
          $version = (Get-Content (Join-Path $clawDir '.source-version') -Raw).Trim()
          Write-Host "Source: $version"
          if ($version -ne $env:CLAUDE_VERSION) { throw "Expected Claude $env:CLAUDE_VERSION, installed $version" }
          $nativeVersion = (& (Join-Path $clawDir 'claude.fallback.exe') --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $nativeVersion -ne "$version (Claude Code)") {
            throw "Native subprocess version mismatch: $nativeVersion"
          }

      - name: Assert renderer runtime was reported
        shell: powershell
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'install-windows.log'
          $line = Select-String -Path $log -Pattern 'Renderer runtime:' | Select-Object -Last 1
          if (-not $line) {
            Write-Error 'install.ps1 did not report the renderer runtime'
          }
          Write-Host $line.Line

      - name: Verify Bun.ant shim provides the renderer API
        shell: powershell
        run: |
          $check = Join-Path $env:RUNNER_TEMP 'bun-ant-shim-check.js'
          $code = @'
          require(require("os").homedir() + "/.clawgod/bun-ant-shim.mjs");
          if (typeof Bun.ant?.CellSegmenter !== "function") {
            console.error("bun-ant-shim did not install Bun.ant.CellSegmenter");
            process.exit(1);
          }
          const seg = new Bun.ant.CellSegmenter({
            ambiguousIsNarrow: true,
            screen: { widthMask: 3, narrow: 0, wide: 1, spacerTail: 2, spacerHead: 3, emptyCharIndex: 0, spacerCharIndex: 1, emptyWord: 0, tabWidth: 8 },
            tabWidth: 8,
          });
          const cells = new Int32Array(64);
          const runs = new Int32Array(64);
          if (seg.segment("ab", cells, runs, false) !== 2) {
            console.error("segment() mismatch");
            process.exit(1);
          }
          const screen = new Int32Array(64);
          const charMap = new Int32Array(seg.graphemes.length);
          if (seg.paint(screen, 8, 0, 0, cells, 2, undefined, charMap, new Int32Array(2)) === 0) {
            console.error("paint() reported no damage");
            process.exit(1);
          }
          console.log("bun-ant shim: OK");
          '@
          Set-Content -Path $check -Value $code -Encoding ASCII
          bun $check
          if ($LASTEXITCODE -ne 0) {
            Write-Error 'bun-ant shim check failed'
          }

      - name: Check patch coverage against the known baseline
        shell: powershell
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'install-windows.log'
          bun src/ci/check-patch-coverage.mjs $log windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify configured provider was preserved
        shell: powershell
        run: |
          bun src/ci/provider-startup-fixture.mjs verify (Join-Path $env:RUNNER_TEMP 'install-windows.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test - clawgod --version
        timeout-minutes: 1
        shell: powershell
        run: |
          $launcher = Join-Path $env:USERPROFILE '.local\bin\clawgod.cmd'
          if (-not (Test-Path $launcher)) {
            Write-Error "Launcher missing: $launcher"
          }
          $previousErrorAction = $ErrorActionPreference
          try {
            $ErrorActionPreference = 'Continue'
            $output = & $launcher --version 2>&1 | Out-String
            $exitCode = $LASTEXITCODE
          } finally {
            $ErrorActionPreference = $previousErrorAction
          }
          Write-Host $output
          if ($exitCode -ne 0) {
            Write-Error "clawgod --version exited $exitCode"
          }
          if ($output -match 'proxy on port') { throw 'Version query started a provider listener' }

      - name: Smoke test - tool/command table probe
        timeout-minutes: 2
        shell: powershell
        run: |
          $previousErrorAction = $ErrorActionPreference
          try {
            $ErrorActionPreference = 'Continue'
            $out = & bun (Join-Path $env:USERPROFILE '.clawgod\startup-check.mjs') `
              (Get-Command bun).Source (Join-Path $env:USERPROFILE '.clawgod\cli.mjs') --probe-tools 2>&1 | Out-String
            $rc = $LASTEXITCODE
          } finally {
            $ErrorActionPreference = $previousErrorAction
          }
          Write-Host $out
          if ($rc -ne 0) { Write-Error "tool/command table probe exited $rc" }
          if ($out -match 'null is not an object|l\.name|s\.isMcp') {
            Write-Error 'null hole detected in tool/command tables'
          }

      - name: Interactive renderer regression (Windows ConPTY)
        shell: powershell
        run: |
          $clawDir = Join-Path $env:USERPROFILE '.clawgod'
          $version = (Get-Content (Join-Path $clawDir '.source-version') -Raw).Trim()
          $testArgs = @(
            'src/ci/tui-smoke.mjs',
            '--cli', (Join-Path $clawDir 'cli.mjs'),
            '--bun', (Get-Command bun).Source,
            '--native', (Join-Path $clawDir 'claude.fallback.exe'),
            '--version', $version,
            '--output', (Join-Path $env:RUNNER_TEMP 'tui-artifacts')
          )
          node @testArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload terminal regression evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-tui-${{ matrix.claude.version }}
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/tui-artifacts/*.log
            ${{ runner.temp }}/tui-artifacts/*.txt
            ${{ runner.temp }}/tui-artifacts/*.json
