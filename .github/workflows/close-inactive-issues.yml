name: Close inactive issues

on:
  pull_request:
    paths:
      - .bun-version
      - package.json
      - tsconfig.json
      - biome.json
      - bunfig.toml
      - .github/scripts/close-inactive-issues*.mjs
      - .github/workflows/close-inactive-issues.yml
  push:
    branches: [main]
    paths:
      - .bun-version
      - package.json
      - tsconfig.json
      - biome.json
      - bunfig.toml
      - .github/scripts/close-inactive-issues*.mjs
      - .github/workflows/close-inactive-issues.yml
  schedule:
    - cron: '35 7 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview eligible issues without closing them'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Check inactivity policy tests
        run: bun run test:issues

  close:
    needs: check
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    concurrency:
      group: close-inactive-issues
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Close issues without a reply for at least 30 days
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        with:
          script: |
            const { pathToFileURL } = await import('node:url');
            const { default: closeInactiveIssues } = await import(pathToFileURL(process.env.GITHUB_WORKSPACE + '/.github/scripts/close-inactive-issues.mjs').href);
            await closeInactiveIssues({ github, context, core, dryRun: process.env.DRY_RUN === 'true' });
