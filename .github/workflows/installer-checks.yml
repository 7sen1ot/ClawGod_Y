name: Installer and proxy checks

on:
  workflow_call:
    inputs:
      installer_checks:
        type: boolean
        default: true
      proxy_checks:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  proxy:
    if: inputs.proxy_checks && !inputs.installer_checks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun run test:proxy
      - name: Check prompt transport through the proxy
        run: bun test ./src/tests/prompt-request.integration.test.mjs

  lifecycle:
    if: inputs.installer_checks
    name: Installer lifecycle (${{ matrix.os }}, Bun ${{ matrix.minimum && 'minimum' || 'pinned' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-26
          - os: windows-latest
          - os: ubuntu-latest
            minimum: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Resolve Bun version
        id: bun
        shell: bash
        env:
          MINIMUM: ${{ matrix.minimum || false }}
        run: |
          if [ "$MINIMUM" = true ]; then
            version=$(node -p "require('./package.json').engines.bun.replace(/^>=/, '')")
          else
            version=$(cat .bun-version)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}
      - name: Check source fixtures for startup and text assets
        if: '!matrix.minimum'
        shell: bash
        run: |
          bun test ./src/tests/startup-check.test.mjs
          bun test ./src/tests/post-process.test.mjs
      - name: Check proxy and prompt transport
        if: '!matrix.minimum && inputs.proxy_checks'
        run: |
          bun run test:proxy
          bun test ./src/tests/prompt-request.integration.test.mjs
      - name: Check the renderer shim under Bun on Unix
        if: runner.os != 'Windows' && !matrix.minimum
        run: bun test ./src/tests/bun-ant-shim.test.mjs
      - run: bun run test:installer
      - name: Check release archive packaging
        run: |
          bun build.js --release v0.0.0-ci
          bun .github/scripts/release-assets.mjs v0.0.0-ci
