name: Installer and proxy checks

on:
  workflow_call:
    inputs:
      installer_checks:
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - src/shared/openai-proxy.cjs
      - src/tests/openai-proxy*.test.mjs
      - package.json
      - .bun-version
      - .github/workflows/installer-checks.yml
  pull_request:
    paths:
      - src/shared/openai-proxy.cjs
      - src/tests/openai-proxy*.test.mjs
      - package.json
      - .bun-version
      - .github/workflows/installer-checks.yml

permissions:
  contents: read

jobs:
  proxy:
    if: ${{ !inputs.installer_checks }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun run test:proxy

  lifecycle:
    if: inputs.installer_checks
    name: Installer lifecycle (${{ matrix.os }}, Bun ${{ matrix.bun || 'pinned' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-26
          - os: windows-latest
          - os: ubuntu-latest
            bun: '1.3.14'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ matrix.bun }}
          bun-version-file: ${{ matrix.bun == '' && '.bun-version' || '' }}
      - name: Check source fixtures for startup and text assets
        if: matrix.bun == ''
        shell: bash
        run: |
          bun src/tests/startup-check.test.mjs
          bun src/tests/post-process.test.mjs
      - name: Check Chat Completions on scheduled, manual and release runs
        if: matrix.bun == '' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/'))
        run: bun run test:proxy
      - name: Check the renderer shim under Bun on Unix
        if: runner.os != 'Windows' && matrix.bun == ''
        run: bun src/tests/bun-ant-shim.test.mjs
      - run: bun run test:installer
      - name: Check final generated installer with an injected release version
        run: |
          bun -e "require('./.github/scripts/release-assets.cjs').prepareInstallers(process.cwd(), 'v0.0.0-ci')"
          bun src/tests/installer-lifecycle.test.mjs ${{ runner.os == 'Windows' && 'install.ps1' || 'install.sh' }}
      - name: Check Unix native subprocess version and official binary isolation
        if: runner.os != 'Windows'
        run: bun src/tests/native-refresh.test.mjs
      - name: Check Windows startup, native isolation and recovery
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./src/windows/startup-check.test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./src/windows/launchers.test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./src/windows/source-recovery.test.ps1
