name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  compat:
    permissions:
      contents: write
    uses: ./.github/workflows/compat-daily.yml

  extended-platforms:
    uses: ./.github/workflows/platform-compat.yml

  release:
    needs: [compat, extended-platforms]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Build release notes
        run: |
          tag="$GITHUB_REF_NAME"
          prev=$(git for-each-ref --sort=-version:refname --exclude="refs/tags/$tag" \
            --count=1 --format='%(refname:strip=2)' refs/tags)
          range="$tag"
          if [ -n "$prev" ]; then range="$prev..$tag"; fi
          {
            echo "## Changes"
            echo
            git log --pretty='- %s (%h)' "$range"
            echo
            echo "## Install"
            echo
            echo '**macOS / Linux:**'
            echo '```bash'
            echo "curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | bash"
            echo '```'
            echo
            echo '**Windows (PowerShell):**'
            echo '```powershell'
            echo "irm https://github.com/${{ github.repository }}/releases/latest/download/install.ps1 | iex"
            echo '```'
            if [ -n "$prev" ]; then
              echo
              echo "**Full changelog:** https://github.com/${{ github.repository }}/compare/${prev}...${tag}"
            fi
          } > release-notes.md

      - name: Prepare and verify final release files
        run: |
          bun build.js --release "$GITHUB_REF_NAME"
          bun .github/scripts/release-assets.mjs "$GITHUB_REF_NAME"
          bash -n install.sh
          bash -n uninstall.sh

      - name: Check installation and uninstall from the final release scripts
        run: bun test --timeout 120000 ./src/tests/installer-lifecycle.test.mjs

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" install.sh install.ps1 uninstall.sh uninstall.ps1 dist/clawgod-runtime.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "$tag" install.sh install.ps1 uninstall.sh uninstall.ps1 dist/clawgod-runtime.tar.gz dist/SHA256SUMS \
              --title "ClawGod_Y $tag" \
              --notes-file release-notes.md
          fi
