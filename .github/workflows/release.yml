name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  compat:
    permissions:
      actions: read
      contents: write
      issues: write
    uses: ./.github/workflows/compat-daily.yml

  build-import:
    uses: ./.github/workflows/build-import.yml

  release:
    needs: [compat, build-import]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v0.0.0-ci.{0}', github.run_id) }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Download import tools
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: clawgod-import-*
          merge-multiple: true
          path: dist

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Build release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="$GITHUB_REF_NAME"
          prev=$(git for-each-ref --sort=-version:refname --exclude="refs/tags/$tag" \
            --count=1 --format='%(refname:strip=2)' refs/tags)
          range="$tag"
          if [ -n "$prev" ]; then range="$prev..$tag"; fi
          {
            echo "## Changes"
            echo
            git log --pretty='- %s (%h)' "$range"
            echo
            echo "## Install"
            echo
            echo '**macOS / Linux:**'
            echo '```bash'
            echo "curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | bash"
            echo '```'
            echo
            echo '**Windows (PowerShell):**'
            echo '```powershell'
            echo "irm https://github.com/${{ github.repository }}/releases/latest/download/install.ps1 | iex"
            echo '```'
            if [ -n "$prev" ]; then
              echo
              echo "**Full changelog:** https://github.com/${{ github.repository }}/compare/${prev}...${tag}"
            fi
          } > release-notes.md

      - name: Prepare and verify final release files
        run: |
          bun run build
          bun .github/scripts/release-assets.cjs "$RELEASE_TAG"
          bash -n install.sh
          bash -n uninstall.sh

      - name: Check installation and uninstall from the final release scripts
        run: bun src/tests/installer-lifecycle.test.mjs install.sh

      - name: Upload branch release artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ github.sha }}
          path: |
            install.sh
            install.ps1
            uninstall.sh
            uninstall.ps1
            dist/clawgod-import-*

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" install.sh install.ps1 uninstall.sh uninstall.ps1 dist/clawgod-import-* --clobber
          else
            gh release create "$tag" install.sh install.ps1 uninstall.sh uninstall.ps1 dist/clawgod-import-* \
              --title "ClawGod_Y $tag" \
              --notes-file release-notes.md
          fi
